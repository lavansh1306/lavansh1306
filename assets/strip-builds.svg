<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 96" width="1000" height="96" role="img" aria-labelledby="t d">
<title id="t">The builds</title><desc id="d">Section: The builds</desc>
<defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter><clipPath id="frame"><rect width="1000" height="96" rx="14"/></clipPath></defs>
<style>@font-face{font-family:'lc-display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'lc-mono';src:url(data:font/woff2;base64,) format('woff2');}.display{font-family:'lc-display',sans-serif}.mono{font-family:'lc-mono',sans-serif}
text{dominant-baseline:alphabetic}
.up{letter-spacing:.14em}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.run{animation:run 4.5s cubic-bezier(.7,0,.3,1) infinite}
