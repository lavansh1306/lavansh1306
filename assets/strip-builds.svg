<rect width="1000" height="96" fill="#111312"/>
<text x="40" y="40" class="mono up" font-size="12" fill="#ff5b1f" text-anchor="start">02</text>
<text x="960" y="40" class="mono up" font-size="11" fill="#8f918b" text-anchor="end">RANKED BY DEPTH, ORIGINALITY AND USE</text>
<text x="40" y="78" class="display" font-size="30" fill="#f1ede4">The builds</text>
<line x1="249" y1="68" x2="960" y2="68" stroke="#ffffff" stroke-opacity=".15"/>
